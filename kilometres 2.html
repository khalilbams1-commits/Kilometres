body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 16px;box-sizing:border-box}
h1{font-size:14px;letter-spacing:.3em;margin:6px 0;opacity:.7}
#face{position:relative;width:min(80vw,340px);height:min(60vw,260px);margin-top:10px}
.eye{position:absolute;top:18%;width:24%;height:34%;background:#7fd6ff;border-radius:50%;transition:all .25s;animation:blink 5s infinite;transform-origin:center}
#eL{left:14%}#eR{right:14%}
#mouth{position:absolute;left:50%;bottom:12%;width:30%;height:8%;transform:translateX(-50%);background:#7fd6ff;border-radius:0 0 50% 50%/0 0 100% 100%;transition:all .25s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes breathe{0%,100%{opacity:.35;transform:scaleY(.15)}50%{opacity:.7;transform:scaleY(.2)}}
@keyframes talk{0%,100%{height:6%}50%{height:18%}}
@keyframes think{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
body[data-s=ecoute] .eye{transform:scale(1.12);background:#9dffcf}
body[data-s=ecoute] #mouth{width:12%;height:10%;border-radius:50%;background:#9dffcf}
body[data-s=reflexion] #face{animation:think 1.2s infinite}
body[data-s=reflexion] .eye{height:22%;top:24%}
body[data-s=parle] #mouth{animation:talk .35s infinite}
body[data-s=veille] .eye{animation:breathe 4s infinite;height:34%}
body[data-s=veille] #mouth{opacity:.2}
body[data-s=joie] .eye{height:16%;border-radius:100% 100% 0 0;background:#ffe27f;animation:none}
body[data-s=joie] #mouth{width:40%;height:16%;background:#ffe27f}
body[data-s=surprise] .eye{transform:scale(1.25);animation:none}
body[data-s=surprise] #mouth{width:14%;height:16%;border-radius:50%}
body[data-s=taquin] #eL{height:12%;top:26%;animation:none}
body[data-s=taquin] #mouth{width:34%;height:5%;border-radius:0 0 40% 40%;transform:translateX(-50%) rotate(-6deg);background:#ffb27f}
#log{text-shadow:0 1px 6px #000;min-height:44px;max-width:420px;text-align:center;font-size:16px;line-height:1.35;opacity:.9;padding:0 6px}
.row{display:flex;gap:10px;width:100%;max-width:420px;align-items:center}
button{font:inherit;border:0;border-radius:14px;padding:14px;background:#1d2b4a;color:#e8eefc}
#talk{flex:1;background:#2b7fff;font-weight:600;font-size:17px}
#mic[aria-pressed=false]{background:#5a1f2a}
input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid #2a3a5c;background:#101a30;color:#e8eefc;border-radius:12px;padding:12px}
.small{font-size:13px;padding:10px 12px}
#panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
</style></head>
<body data-s="repos">
<h1>KILOMÈTRES</h1>
<div id="face"><div class="eye" id="eL"></div><div class="eye" id="eR"></div><div id="mouth"></div></div>
<div id="log">Touche « Parler » pour commencer.</div>
<div id="panel">
 <div class="row">
  <button id="talk">🎤 Parler</button>
  <button id="mic" class="small" aria-pressed="true">Micro : activé</button>
  <button id="lang" class="small">FR → EN</button>
 </div>
 <div class="row"><input id="txt" placeholder="Ou écris ici…" autocomplete="off"><button id="send" class="small">Envoyer</button></div>
 <div class="row">
  <button class="small" id="mem">Voir la mémoire</button>
  <button class="small" id="wipe">Effacer la mémoire</button>
 </div>
</div>
<script>
(function(){
var body=document.body,logEl=document.getElementById('log');
var micOn=true,busy=false,idleT,rec=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var lang='fr';try{lang=localStorage.getItem('klang')||'fr'}catch(e){}
var T={
fr:{loc:'fr-FR',talk:'🎤 Parler',micOn:'Micro : activé',micOff:'Micro : coupé',ph:'Ou écris ici…',send:'Envoyer',mem:'Voir la mémoire',wipe:'Effacer la mémoire',start:'Touche « Parler » pour commencer.',
 listen:'Je t\u2019écoute…',muted:'Le micro est coupé. Réactive-le ou écris-moi.',nosr:'Ce navigateur ne permet pas l\u2019écoute vocale ici. Écris-moi dans la case.',
 denied:'Le micro est refusé. Autorise-le dans Réglages > Safari, ou écris-moi.',nothing:'Je n\u2019ai rien entendu. Réessaie.',fail:'Impossible de lancer le micro. Écris-moi dans la case.',
 hello:'Salut Josué. Content de te voir.',how:'Je vais bien, calme et curieux. Et toi ?',name:'Je m\u2019appelle Kilomètres. Je suis ton compagnon de bureau.',
 noted:function(x){return 'C\u2019est noté : '+x+'.'},knows:function(l){return l.length?'Je retiens : '+l.join(' ; ')+'.':'Je ne retiens rien pour l\u2019instant.'},
 erased:'Tout est effacé.',wiped:'Mémoire effacée.',joke:'Pourquoi les architectes ne mentent jamais ? Parce que leurs plans finissent toujours par se dévoiler.',thanks:'Avec plaisir.',
 time:function(h,m){return 'Il est '+h+' heures '+m+'.'},oh:'Oh !',
 dunno:function(q){return 'Je t\u2019ai entendu : '+q+'. Je ne sais pas encore répondre à ça, mais dis-moi « retiens que… » et je garde l\u2019information.'},
 switched:'Langue : français. Salut Josué !',
 re:{hello:/^(bonjour|salut|coucou|yo|bonsoir)/,how:/comment (tu )?(vas|ça va|ca va)/,name:/(t.appelles|ton nom|qui es.tu)/,remember:/retiens (que )?(.+)/,knows:/(que sais.tu|qu.est.ce que tu (sais|retiens)|souviens|mémoire)/,erase:/(oublie|efface)/,joke:/blague|drôle/,thanks:/(merci|bravo|super)/,time:/heure/,wow:/(wow|incroyable|vraiment)/}},
en:{loc:'en-US',talk:'🎤 Talk',micOn:'Mic: on',micOff:'Mic: off',ph:'Or type here…',send:'Send',mem:'Show memory',wipe:'Erase memory',start:'Tap “Talk” to begin.',
 listen:'I\u2019m listening…',muted:'The mic is off. Turn it on or type to me.',nosr:'This browser can\u2019t do voice listening here. Type in the box.',
 denied:'Mic access denied. Allow it in Settings > Safari, or type to me.',nothing:'I didn\u2019t hear anything. Try again.',fail:'Can\u2019t start the mic. Type in the box.',
 hello:'Hi Josué. Good to see you.',how:'I\u2019m doing well, calm and curious. And you?',name:'My name is Kilomètres. I\u2019m your desk companion.',
 noted:function(x){return 'Noted: '+x+'.'},knows:function(l){return l.length?'I remember: '+l.join('; ')+'.':'I\u2019m not remembering anything yet.'},
 erased:'Everything is erased.',wiped:'Memory erased.',joke:'Why do architects never lie? Because their plans always end up revealing themselves.',thanks:'My pleasure.',
 time:function(h,m){return 'It is '+h+':'+(m<10?'0'+m:m)+'.'},oh:'Oh!',
 dunno:function(q){return 'I heard you: '+q+'. I can\u2019t answer that yet, but say “remember that…” and I\u2019ll keep it.'},
 switched:'Language: English. Hi Josué!',
 re:{hello:/^(hello|hi|hey|good (morning|evening)|yo)/,how:/how are you|how\u2019s it going|how is it going/,name:/(your name|who are you)/,remember:/remember (that )?(.+)/,knows:/(what do you (know|remember)|memory)/,erase:/(forget|erase|delete)/,joke:/joke|funny/,thanks:/(thank|great job|awesome)/,time:/time/,wow:/(wow|incredible|really)/}}
};
function t(){return T[lang]}
function setS(s){body.setAttribute('data-s',s)}
function say(x){logEl.textContent=x}
function loadMem(){try{return JSON.parse(localStorage.getItem('kmem')||'[]')}catch(e){return[]}}
function saveMem(m){try{localStorage.setItem('kmem',JSON.stringify(m))}catch(e){}}
var mem=loadMem();
function idle(){clearTimeout(idleT);idleT=setTimeout(function(){setS('veille')},20000)}
function pickVoice(){var v=speechSynthesis.getVoices();var p=lang==='en'?/^en/i:/^fr/i;for(var i=0;i<v.length;i++){if(p.test(v[i].lang))return v[i]}return null}
function speak(x,mood){
  say(x);setS(mood||'parle');
  if(!window.speechSynthesis){setTimeout(function(){setS('repos');idle()},1500);return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(x);u.lang=t().loc;var v=pickVoice();if(v)u.voice=v;
  u.onstart=function(){setS(mood&&mood!=='parle'?mood:'parle')};
  u.onend=u.onerror=function(){setS('repos');idle()};
  speechSynthesis.speak(u);
}
function reply(q){
  var s=q.toLowerCase().trim(),L=t(),R=L.re,m;
  setS('reflexion');
  setTimeout(function(){
    if(R.hello.test(s))return speak(L.hello,'joie');
    if(R.how.test(s))return speak(L.how);
    if(R.name.test(s))return speak(L.name);
    if(m=s.match(R.remember)){mem.push(m[2]);saveMem(mem);return speak(L.noted(m[2]),'joie')}
    if(R.knows.test(s))return speak(L.knows(mem));
    if(R.erase.test(s)){mem=[];saveMem(mem);return speak(L.erased)}
    if(R.joke.test(s))return speak(L.joke,'taquin');
    if(R.thanks.test(s))return speak(L.thanks,'joie');
    if(R.time.test(s)){var d=new Date();return speak(L.time(d.getHours(),d.getMinutes()))}
    if(R.wow.test(s))return speak(L.oh,'surprise');
    speak(L.dunno(q));
  },600);
}
function unlock(){try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function listen(){
  var L=t();
  if(!micOn){say(L.muted);return}
  if(!SR){say(L.nosr);return}
  if(busy)return;unlock();
  rec=new SR();rec.lang=L.loc;rec.interimResults=false;rec.maxAlternatives=1;
  busy=true;setS('ecoute');say(L.listen);
  rec.onresult=function(e){var x=e.results[0][0].transcript;say('« '+x+' »');reply(x)};
  rec.onerror=function(e){busy=false;setS('repos');say(e.error==='not-allowed'||e.error==='service-not-allowed'?t().denied:t().nothing)};
  rec.onend=function(){busy=false;if(body.getAttribute('data-s')==='ecoute')setS('repos')};
  try{rec.start()}catch(e){busy=false;say(L.fail);setS('repos')}
}
var $=function(i){return document.getElementById(i)};
function ui(){
  var L=t();document.documentElement.lang=lang;
  $('talk').textContent=L.talk;$('mic').textContent=micOn?L.micOn:L.micOff;
  $('txt').placeholder=L.ph;$('send').textContent=L.send;$('mem').textContent=L.mem;$('wipe').textContent=L.wipe;
  $('lang').textContent=lang==='fr'?'FR → EN':'EN → FR';
}
$('talk').onclick=listen;
$('mic').onclick=function(){
  micOn=!micOn;this.setAttribute('aria-pressed',micOn);ui();
  if(!micOn&&rec){try{rec.abort()}catch(e){}setS('repos')}
};
$('lang').onclick=function(){
  lang=lang==='fr'?'en':'fr';try{localStorage.setItem('klang',lang)}catch(e){}
  if(rec){try{rec.abort()}catch(e){}}busy=false;ui();unlock();speak(t().switched,'joie');
};
function sendTxt(){var i=$('txt');var v=i.value.trim();if(!v)return;i.value='';unlock();say('« '+v+' »');reply(v)}
$('send').onclick=sendTxt;
$('txt').addEventListener('keydown',function(e){if(e.key==='Enter')sendTxt()});
$('mem').onclick=function(){speak(t().knows(mem))};
$('wipe').onclick=function(){mem=[];saveMem(mem);speak(t().wiped)};
if(window.speechSynthesis)speechSynthesis.getVoices();
ui();say(t().start);idle();
})();
</script>
