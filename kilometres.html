<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KILOMÈTRES</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b1220;color:#e8eefc;font-family:-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 16px;box-sizing:border-box}
h1{font-size:14px;letter-spacing:.3em;margin:6px 0;opacity:.7}
#face{position:relative;width:min(80vw,340px);height:min(60vw,260px);margin-top:10px}
.eye{position:absolute;top:18%;width:24%;height:34%;background:#7fd6ff;border-radius:50%;transition:all .25s;animation:blink 5s infinite;transform-origin:center}
#eL{left:14%}#eR{right:14%}
#mouth{position:absolute;left:50%;bottom:12%;width:30%;height:8%;transform:translateX(-50%);background:#7fd6ff;border-radius:0 0 50% 50%/0 0 100% 100%;transition:all .25s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes breathe{0%,100%{opacity:.35;transform:scaleY(.15)}50%{opacity:.7;transform:scaleY(.2)}}
@keyframes talk{0%,100%{height:6%}50%{height:18%}}
@keyframes think{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
body[data-s=ecoute] .eye{transform:scale(1.12);background:#9dffcf}
body[data-s=ecoute] #mouth{width:12%;height:10%;border-radius:50%;background:#9dffcf}
body[data-s=reflexion] #face{animation:think 1.2s infinite}
body[data-s=reflexion] .eye{height:22%;top:24%}
body[data-s=parle] #mouth{animation:talk .35s infinite}
body[data-s=veille] .eye{animation:breathe 4s infinite;height:34%}
body[data-s=veille] #mouth{opacity:.2}
body[data-s=joie] .eye{height:16%;border-radius:100% 100% 0 0;background:#ffe27f;animation:none}
body[data-s=joie] #mouth{width:40%;height:16%;background:#ffe27f}
body[data-s=surprise] .eye{transform:scale(1.25);animation:none}
body[data-s=surprise] #mouth{width:14%;height:16%;border-radius:50%}
body[data-s=taquin] #eL{height:12%;top:26%;animation:none}
body[data-s=taquin] #mouth{width:34%;height:5%;border-radius:0 0 40% 40%;transform:translateX(-50%) rotate(-6deg);background:#ffb27f}
#log{min-height:44px;max-width:420px;text-align:center;font-size:16px;line-height:1.35;opacity:.9;padding:0 6px}
.row{display:flex;gap:10px;width:100%;max-width:420px;align-items:center}
button{font:inherit;border:0;border-radius:14px;padding:14px;background:#1d2b4a;color:#e8eefc}
#talk{flex:1;background:#2b7fff;font-weight:600;font-size:17px}
#mic[aria-pressed=false]{background:#5a1f2a}
input{flex:1;font:inherit;font-size:16px;border:1px solid #2a3a5c;background:#101a30;color:#e8eefc;border-radius:12px;padding:12px}
.small{font-size:13px;padding:10px 12px}
#panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
</style></head>
<body data-s="repos">
<h1>KILOMÈTRES</h1>
<div id="face"><div class="eye" id="eL"></div><div class="eye" id="eR"></div><div id="mouth"></div></div>
<div id="log">Touche « Parler » pour commencer.</div>
<div id="panel">
 <div class="row">
  <button id="talk">🎤 Parler</button>
  <button id="mic" class="small" aria-pressed="true">Micro : activé</button>
 </div>
 <div class="row"><input id="txt" placeholder="Ou écris ici…" autocomplete="off"><button id="send" class="small">Envoyer</button></div>
 <div class="row">
  <button class="small" id="mem">Voir la mémoire</button>
  <button class="small" id="wipe">Effacer la mémoire</button>
 </div>
</div>
<script>
(function(){
var body=document.body,logEl=document.getElementById('log');
var micOn=true,busy=false,idleT,rec=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setS(s){body.setAttribute('data-s',s)}
function say(t){logEl.textContent=t}
function loadMem(){try{return JSON.parse(localStorage.getItem('kmem')||'[]')}catch(e){return[]}}
function saveMem(m){try{localStorage.setItem('kmem',JSON.stringify(m))}catch(e){}}
var mem=loadMem();
function idle(){clearTimeout(idleT);idleT=setTimeout(function(){setS('veille')},20000)}
function pickVoice(){var v=speechSynthesis.getVoices();for(var i=0;i<v.length;i++){if(/^fr/i.test(v[i].lang))return v[i]}return null}
function speak(t,mood){
  say(t);setS(mood||'parle');
  if(!window.speechSynthesis){setTimeout(function(){setS('repos');idle()},1500);return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';var v=pickVoice();if(v)u.voice=v;
  u.onstart=function(){setS('parle')};
  u.onend=u.onerror=function(){setS('repos');idle()};
  speechSynthesis.speak(u);
}
function reply(q){
  var s=q.toLowerCase().trim();var m;
  setS('reflexion');
  setTimeout(function(){
    if(/^(bonjour|salut|coucou|yo|bonsoir)/.test(s))return speak('Salut Josué. Content de te voir.','joie');
    if(/comment (tu )?(vas|ça va|ca va)/.test(s))return speak('Je vais bien, calme et curieux. Et toi ?');
    if(/(t.appelles|ton nom|qui es.tu)/.test(s))return speak('Je m\u2019appelle Kilomètres. Je suis ton compagnon de bureau.');
    if(m=s.match(/retiens (que )?(.+)/)){mem.push(m[2]);saveMem(mem);return speak('C\u2019est noté : '+m[2]+'.','joie')}
    if(/(que sais.tu|qu.est.ce que tu (sais|retiens)|souviens|mémoire)/.test(s)){return speak(mem.length?'Je retiens : '+mem.join(' ; ')+'.':'Je ne retiens rien pour l\u2019instant.')}
    if(/(oublie|efface)/.test(s)){mem=[];saveMem(mem);return speak('Tout est effacé.')}
    if(/blague|drôle/.test(s))return speak('Pourquoi les architectes ne mentent jamais ? Parce que leurs plans finissent toujours par se dévoiler.','taquin');
    if(/(merci|bravo|super)/.test(s))return speak('Avec plaisir.','joie');
    if(/heure/.test(s)){var d=new Date();return speak('Il est '+d.getHours()+' heures '+d.getMinutes()+'.')}
    if(/(wow|incroyable|vraiment)/.test(s))return speak('Oh !','surprise');
    speak('Je t\u2019ai entendu : '+q+'. Je ne sais pas encore répondre à ça, mais dis-moi « retiens que… » et je garde l\u2019information.');
  },600);
}
function unlock(){try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function listen(){
  if(!micOn){say('Le micro est coupé. Réactive-le ou écris-moi.');return}
  if(!SR){say('Ce navigateur ne permet pas l\u2019écoute vocale ici. Écris-moi dans la case.');return}
  if(busy)return;unlock();
  rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.maxAlternatives=1;
  busy=true;setS('ecoute');say('Je t\u2019écoute…');
  rec.onresult=function(e){var t=e.results[0][0].transcript;say('« '+t+' »');reply(t)};
  rec.onerror=function(e){busy=false;setS('repos');
    say(e.error==='not-allowed'||e.error==='service-not-allowed'?'Le micro est refusé. Autorise-le dans Réglages > Safari, ou écris-moi.':'Je n\u2019ai rien entendu. Réessaie.')};
  rec.onend=function(){busy=false;if(body.getAttribute('data-s')==='ecoute')setS('repos')};
  try{rec.start()}catch(e){busy=false;say('Impossible de lancer le micro. Écris-moi dans la case.');setS('repos')}
}
document.getElementById('talk').onclick=listen;
document.getElementById('mic').onclick=function(){
  micOn=!micOn;this.setAttribute('aria-pressed',micOn);this.textContent='Micro : '+(micOn?'activé':'coupé');
  if(!micOn&&rec){try{rec.abort()}catch(e){}setS('repos')}
};
function sendTxt(){var i=document.getElementById('txt');var v=i.value.trim();if(!v)return;i.value='';unlock();say('« '+v+' »');reply(v)}
document.getElementById('send').onclick=sendTxt;
document.getElementById('txt').addEventListener('keydown',function(e){if(e.key==='Enter')sendTxt()});
document.getElementById('mem').onclick=function(){reply('que sais-tu')};
document.getElementById('wipe').onclick=function(){mem=[];saveMem(mem);speak('Mémoire effacée.')};
if(window.speechSynthesis)speechSynthesis.getVoices();
idle();
})();
</script>
</body></html>
